<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Kgosiphenyo K. Boabilwe">
    <title>Basic HTML Structure</title>
</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="Parts of HTML structure" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li><a href="https://www.byu.edu/">BYU Home</a></li>
            <li><a href="https://www.churchofjesuschrist.org/?lang=eng">LDS Home</a></li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Alias, harum?</p>
        </section>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quae, tempore?</p>
        </section>
        <aside>
            <img
              src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/albuquerque-new-mexico/1280x800/albuquerque-temple-lds-998219-wallpaper.jpg"
              alt="Albuquerque, New Mexico temple" width="200">
        </aside>
    </main>
    <footer>
        <p>Kgosiphenyo K. Boabilwe</p>
    </footer>
</body>

</html>
